# Reverse proxy in front of the web container (127.0.0.1:8000).
# Installed by deploy/setup_server.sh. For HTTPS run:
#   sudo certbot --nginx -d avir.stradit.com --redirect
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # The domain lets "certbot --nginx -d avir.stradit.com" find this block; "_" keeps
    # the server reachable by IP (default_server) until HTTPS redirects it.
    server_name avir.stradit.com _;

    # Matches Flask MAX_CONTENT_LENGTH (50 MB uploads)
    client_max_body_size 50M;

    # Generated content + uploads straight from the host volume. A file missing on
    # disk goes to the app, which restores it from S3 (services/storage_service.py).
    # Logos are refreshed in place (brand_logo_service.py): always revalidate
    location /static/uploads/brand_logos/ {
        root /opt/socialmedia/data;
        access_log off;
        add_header Cache-Control "no-cache";
        try_files $uri @app;
    }

    location /static/uploads/ {
        root /opt/socialmedia/data;
        access_log off;
        # Generated/uploaded files have unique names and never change
        add_header Cache-Control "public, max-age=2592000";
        # no expires: the app deliberately disables static caching (app.py)
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Same id in nginx's and the app's logs for one request
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Same id in nginx's and the app's logs for one request
        proxy_set_header X-Request-ID $request_id;
        # Generation requests can take minutes - keep in step with gunicorn --timeout
        proxy_connect_timeout 60s;
        proxy_send_timeout 1900s;
        proxy_read_timeout 1900s;
        proxy_buffering off;
    }
}
