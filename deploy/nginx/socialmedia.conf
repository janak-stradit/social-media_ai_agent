# Reverse proxy in front of gunicorn. Installed by deploy/setup_server.sh.
# For HTTPS run: sudo certbot --nginx -d your.domain.com
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Matches Flask MAX_CONTENT_LENGTH (50 MB uploads)
    client_max_body_size 50M;

    location /static/ {
        root /opt/socialmedia/app;
        access_log off;
        # no expires: the app deliberately disables static caching (app.py)
        # A generated file missing on disk goes to the app, which restores it
        # from S3 (services/storage_service.py).
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generation requests can take minutes - keep in step with gunicorn --timeout
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_buffering off;
    }
}
