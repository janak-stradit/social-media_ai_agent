name: Deploy to EC2

# Builds the Docker image, pushes it to Amazon ECR and runs it on the EC2 instance
# of a GitHub Environment (web + scheduler containers, deploy/docker-compose.prod.yml).
#  - Manual: Actions -> "Deploy to EC2" -> Run workflow -> pick the branch in the
#    "Use workflow from" dropdown and the environment (production/staging).
#    The branch comes from that dropdown on purpose: GitHub checks it against the
#    Environment's "Deployment branches" rule, so e.g. only main can reach production.
#  - Rollback: Run workflow with "image_tag" = an earlier tag (e.g. sha-1a2b3c4...);
#    nothing is built, that image is pulled from ECR and started.
#  - Automatic: every push to main deploys main to production.
# All configuration lives in the Environment's secrets (see DEPLOYMENT.md):
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, ECR_REPOSITORY,
#   EC2_HOST, EC2_USER, EC2_SSH_KEY, ENV_FILE, and optionally EC2_KNOWN_HOSTS.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (its secrets decide which server and .env are used)"
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
      image_tag:
        description: "Rollback: deploy this existing ECR tag instead of building (e.g. sha-<commit>). Leave empty to build."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write # lets the job assume the AWS role via OIDC - no AWS keys stored in GitHub

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }} -> ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    # One deploy per environment at a time; a second one waits instead of
    # interrupting a half-finished deploy.
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
      cancel-in-progress: false
    env:
      DEPLOY_BRANCH: ${{ github.ref_name }}
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
      ROLLBACK_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || '' }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      REMOTE_DEPLOY_DIR: /opt/socialmedia/deploy

    steps:
      - name: Validate inputs
        run: |
          if ! printf '%s' "$DEPLOY_BRANCH" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "::error::Invalid branch name: $DEPLOY_BRANCH"; exit 1
          fi
          if [ -n "$ROLLBACK_TAG" ] && ! printf '%s' "$ROLLBACK_TAG" | grep -Eq '^sha-[0-9a-f]{7,40}$'; then
            echo "::error::image_tag must look like sha-<commit>, got: $ROLLBACK_TAG"; exit 1
          fi
          echo "Branch: $DEPLOY_BRANCH  Environment: $DEPLOY_ENV  Rollback tag: ${ROLLBACK_TAG:-none}"

      # Checks out the exact commit that triggered this run (github.sha).
      - name: Check out ${{ env.DEPLOY_BRANCH }}
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          missing=""
          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN ECR_REPOSITORY EC2_HOST EC2_USER EC2_SSH_KEY ENV_FILE; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the '$DEPLOY_ENV' environment:$missing"
            exit 1
          fi
          grep -Eq '^[[:space:]]*(export[[:space:]]+)?DATABASE_URL=' <<< "$ENV_FILE" || { echo "::error::ENV_FILE has no DATABASE_URL line"; exit 1; }
          grep -Eq '^[[:space:]]*(export[[:space:]]+)?SECRET_KEY=' <<< "$ENV_FILE" || { echo "::error::ENV_FILE has no SECRET_KEY line"; exit 1; }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          tag="${ROLLBACK_TAG:-sha-$GITHUB_SHA}"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$tag" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi
          if [ -n "$ROLLBACK_TAG" ] && [ "$exists" != true ]; then
            echo "::error::Image tag $tag not found in ECR repository $ECR_REPOSITORY"; exit 1
          fi
          # A re-run of the same commit reuses the image already in ECR
          echo "build=$([ "$exists" = true ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$REGISTRY/$ECR_REPOSITORY:$tag" >> "$GITHUB_OUTPUT"
          echo "Image: $REGISTRY/$ECR_REPOSITORY:$tag (build: $([ "$exists" = true ] && echo no || echo yes))"

      - name: Syntax check
        if: steps.image.outputs.build == 'true'
        run: python3 -m compileall -q -x '(^|/)(soical-media-ai|venv|\.venv|scratch)/' .

      - name: Set up Docker Buildx
        if: steps.image.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.image.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.image }}
          # Shown as "version" on every log line
          build-args: GIT_SHA=${{ github.sha }}
          # Single-manifest image: attestation manifests show up in ECR as untagged
          # images, which the lifecycle policy would expire and break the tag.
          provenance: false
          sbom: false
          # Layer cache in ECR itself: dependency layers (torch, Playwright) are only
          # rebuilt when requirements.txt changes.
          cache-from: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$EC2_KNOWN_HOSTS" ]; then
            printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::EC2_KNOWN_HOSTS not set - trusting the host key found by ssh-keyscan."
            ssh-keyscan -T 15 -H "$EC2_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host ec2
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ConnectTimeout 20
          EOF
          ssh ec2 'echo "Connected to $(hostname) as $(id -un)"'

      - name: Upload deploy scripts
        run: |
          ssh ec2 "command -v rsync >/dev/null || { sudo apt-get update -y && sudo apt-get install -y rsync; }"
          ssh ec2 "sudo mkdir -p '$REMOTE_DEPLOY_DIR' && sudo chown \"\$(id -un):\$(id -gn)\" '$REMOTE_DEPLOY_DIR'"
          rsync -az --delete deploy/ "ec2:$REMOTE_DEPLOY_DIR/"

      - name: Pull and start on EC2
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          IMAGE: ${{ steps.image.outputs.image }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          # stdin: line 1 = short-lived ECR password for the server's docker pull,
          # then the .env content. The server needs no AWS credentials for ECR.
          { aws ecr get-login-password; printf '%s\n' "$ENV_FILE"; } | ssh ec2 \
            "bash '$REMOTE_DEPLOY_DIR/remote_deploy.sh' '$IMAGE' '$REGISTRY' '$GITHUB_SHA' '$DEPLOY_BRANCH'"

      - name: Summary
        if: success()
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          {
            echo "### Deployed \`$DEPLOY_BRANCH\` → **$DEPLOY_ENV**"
            echo "Image tag: \`$TAG\` (roll back later by running this workflow with this tag)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
