name: Code Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # allows SonarQube to decorate PRs with analysis results

jobs:
  python-lint:
    name: Python Lint & Security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Black (format check)
        run: black --check .

      - name: Flake8 (style lint)
        run: flake8 .

      - name: Pylint (deep lint)
        run: pylint agents/ auth/ services/ api/ app.py config.py db.py scheduler_thread.py scripts/

      - name: Bandit (security scan)
        run: bandit -c pyproject.toml -r .

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint (static/js)
        run: npm run lint:js

      - name: HTMLHint (templates)
        run: npm run lint:html

  type-check:
    name: "Static type check (mypy, report-only)"
    runs-on: ubuntu-latest
    continue-on-error: true # ~52 pre-existing errors, mostly SQLAlchemy Column[T] vs. T on
    # untyped legacy `Column(...)` models -- needs a real Mapped[] typing migration, not a lint
    # fix. Kept as its own non-blocking job (not a required check) so it stays visible without
    # gating merges. See CONTRIBUTING.md before promoting this to blocking.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Mypy
        run: mypy .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          SECRET_KEY: ci-test-secret
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    # This job uses an action that is not certified by GitHub, provided by a third party and
    # governed by separate terms of service, privacy policy, and support documentation. Requires
    # a valid GitHub configuration on the SonarQube side (Administration > DevOps platforms >
    # GitHub), the project imported there, and two repo secrets: SONAR_TOKEN and SONAR_HOST_URL.
    # -Dsonar.projectKey below is currently empty (mandatory) -- fill it in with the project key
    # from SonarQube's Project Information page, or this job will fail.
    # See https://docs.sonarqube.org/latest/analysis/github-integration/
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@7295e71c9583053f5bf40e9d4068a0c974603ec8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          # Additional arguments for the sonarcloud scanner
          args:
            # Unique key of your project. You can find it in SonarQube > [my project] > Project Information (top-right menu)
            # mandatory
            -Dsonar.projectKey=
            # Comma-separated paths to directories containing main source files.
            #-Dsonar.sources= # optional, default is project base directory
            # When you need the analysis to take place in a directory other than the one from which it was launched
            #-Dsonar.projectBaseDir= # optional, default is .
            # Comma-separated paths to directories containing test source files.
            #-Dsonar.tests= # optional. For more info about Code Coverage, please refer to https://docs.sonarcloud.io/enriching/test-coverage/overview/
            # Adds more detail to both client and server-side analysis logs, activating DEBUG mode for the scanner, and adding client-side environment variables and system properties to the server-side log of analysis report processing.
            #-Dsonar.verbose= # optional, default is false
