<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Approval - VortexSocial AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            color: #1f2937;
            overflow: hidden;
        }

        .ap-main {
            margin-top: var(--header-h);
            height: calc(100vh - var(--header-h));
            overflow-y: auto;
            background: #f9fafb;
        }

        .approval-shell {
            max-width: 760px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        .approval-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid rgba(229, 231, 235, 0.8);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            padding: 1.75rem;
        }

        /* Platform switcher above the preview - lets the reviewer check
           LinkedIn/Facebook/Instagram, not just the platform it was
           generated for. */
        .preview-platform-tab {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 0.5rem 0.9rem;
            font-weight: 700;
            font-size: 0.82rem;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .preview-platform-tab:hover {
            color: #7366ff;
        }

        .preview-platform-tab.active {
            color: #7366ff;
            border-bottom-color: #7366ff;
        }
    </style>
</head>

<body>
    <header class="app-header">
        <div class="header-brand">
            <div class="brand-logo"></div>
            <div class="brand-text">
                <span class="brand-name">VortexSocial AI</span>
                <span class="brand-tagline">Enterprise Sales Intelligence Command Center</span>
            </div>
        </div>
        <nav class="header-nav">
            <a href="/dashboard" class="header-nav-item"><i class="fas fa-comments me-2"></i>Studio Chat</a>
            <a href="/competitor-dashboard" class="header-nav-item"><i class="fas fa-chart-line me-1"></i>Analysis Dashboard</a>
        </nav>
        <div class="header-actions">
            <a href="{{ url_for('approval_list_page') }}" class="btn-secondary-ent text-decoration-none me-2">
                <i class="fas fa-list-check me-1"></i>All Approvals
            </a>
        </div>
    </header>

    <main class="ap-main">
        <div class="approval-shell">
            <h4 class="fw-bold text-dark mb-1"><i class="fas fa-user-check text-primary me-2"></i>Content Approval Request</h4>
            <p class="text-muted small mb-4">Review the generated post below and record your decision.</p>

            <div class="approval-card" id="approvalReviewCard">
                <div class="text-center text-muted py-5"><i class="fas fa-spinner fa-spin me-2"></i>Loading approval request...</div>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>window.APPROVAL_REQUEST_ID = "{{ request_id }}";</script>
    <script src="{{ url_for('static', filename='js/approval_review.js') }}"></script>
</body>

</html>
