<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Library — AVIR AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="library-page">

<header class="app-header">
    <div class="header-brand">
        <div class="brand-logo">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M12 2.5a9.5 9.5 0 1 0 9.5 9.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                <path d="M12 6.5a5.5 5.5 0 1 0 5.5 5.5" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
                <circle cx="12" cy="12" r="1.7" fill="#fff"/>
            </svg>
        </div>
        <div class="brand-text">
            <span class="brand-name">AVIR AI <span class="beta-badge">Beta</span></span>
            <span class="brand-tagline">Image Library</span>
        </div>
    </div>
    <nav class="header-nav">
        <a href="/dashboard" class="header-nav-item"><i class="fas fa-comments me-2"></i>Studio Chat</a>
        <a href="/library" class="header-nav-item active"><i class="fas fa-images me-2"></i>Image Library</a>
    </nav>
    <div class="header-actions">
        {% include 'partials/user_menu.html' %}
    </div>
</header>

<!-- Filled in by static/js/library.js: campaign folders (/api/library/folders),
     images (/api/library/images), a carousel tray and an image viewer. The view
     is in the address (#all, #favorites, #c=<conversation id>) so Back works. -->
<main class="lib-main">
    <section class="lib-head">
        <div>
            <h1>Image Library</h1>
            <p id="libSummary">Your images, grouped by the campaign that made them.</p>
        </div>
        <div class="lib-search">
            <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
            <input type="search" id="libSearch" placeholder="Search campaigns and images" aria-label="Search your images">
        </div>
    </section>

    <div class="lib-toolbar">
        <div class="lib-views" role="tablist" aria-label="Show">
            <button type="button" class="lib-view active" role="tab" aria-selected="true" data-lib-view="folders"><i class="far fa-folder"></i>Campaigns</button>
            <button type="button" class="lib-view" role="tab" aria-selected="false" data-lib-view="all"><i class="far fa-images"></i>All images</button>
            <button type="button" class="lib-view" role="tab" aria-selected="false" data-lib-view="favorites" id="libFavorites"><i class="far fa-star"></i>Favourites</button>
        </div>
    </div>

    <!-- Inside a campaign: where you are, and what to do with all of it -->
    <div class="lib-crumb d-none" id="libCrumb">
        <button type="button" class="lib-crumb-back" id="libBack"><i class="fas fa-arrow-left" aria-hidden="true"></i>All campaigns</button>
        <div class="lib-crumb-title"><strong id="libFolderTitle"></strong><span id="libFolderCount"></span></div>
        <div class="lib-crumb-actions">
            <button type="button" class="lib-btn" id="libFolderChat"><i class="fas fa-comments me-1"></i>Open conversation</button>
            <button type="button" class="lib-btn is-primary" id="libFolderCarousel"><i class="fas fa-clone me-1"></i>Make a carousel</button>
        </div>
    </div>

    <div class="lib-folders" id="libFolders" aria-live="polite"></div>
    <div class="lib-grid d-none" id="libGrid" aria-live="polite"></div>
    <div class="lib-more"><button type="button" class="lib-btn d-none" id="libMore">Show more</button></div>
</main>

<!-- The carousel tray: ticked images in order; drag (or use the arrows) to reorder -->
<div class="lib-tray d-none" id="libTray" role="region" aria-label="Selected images">
    <div class="lib-tray-head">
        <strong id="libTrayCount"></strong>
        <span class="lib-tray-hint" id="libTrayHint"></span>
    </div>
    <ol class="lib-tray-items" id="libTrayItems"></ol>
    <div class="lib-tray-actions">
        <button type="button" class="lib-btn" id="libClear">Clear</button>
        <button type="button" class="lib-btn" id="libDeleteSelected"><i class="far fa-trash-can me-1"></i>Delete</button>
        <button type="button" class="lib-btn" id="libApprove"><i class="fas fa-paper-plane me-1"></i>Send for approval</button>
        <button type="button" class="lib-btn is-primary" id="libSchedule"><i class="fas fa-calendar-plus me-1"></i>Schedule</button>
    </div>
</div>

<!-- One image, larger, with its details, versions and actions -->
<dialog class="lib-viewer" id="libViewer" aria-label="Image">
    <form method="dialog"><button class="cal-dialog-close" aria-label="Close"><i class="fas fa-xmark" aria-hidden="true"></i></button></form>
    <div class="lib-viewer-body">
        <div class="lib-viewer-media"><img id="libViewerImg" src="" alt=""></div>
        <aside class="lib-viewer-side">
            <p class="lib-viewer-text" id="libViewerText"></p>
            <div class="lib-viewer-meta" id="libViewerMeta"></div>
            <div class="lib-versions d-none" id="libVersions">
                <div class="lib-side-label" id="libVersionsLabel">Versions</div>
                <div class="lib-versions-strip" id="libVersionsStrip"></div>
            </div>
            <div class="lib-viewer-actions" id="libViewerActions"></div>
        </aside>
    </div>
</dialog>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="ent-toast" role="alert">
        <div class="ent-toast-body" id="toastBody"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<!-- "Schedule" is shown as "Soon" until STUDIO_SCHEDULING=true (config.py) -->
<script>window.SCHEDULING_ENABLED = {{ 'true' if config.STUDIO_SCHEDULING else 'false' }};</script>
<script src="{{ url_for('static', filename='js/post_preview.js') }}"></script>
<script src="{{ url_for('static', filename='js/approval_send.js') }}"></script>
<script src="{{ url_for('static', filename='js/undo.js') }}"></script>
<script src="{{ url_for('static', filename='js/library.js') }}"></script>
<script src="{{ url_for('static', filename='js/user_menu.js') }}"></script>
    {% include 'partials/cookie_consent.html' %}
</body>
</html>
