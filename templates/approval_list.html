<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approvals - VortexSocial AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            color: #1f2937;
            overflow: hidden;
        }

        .bc-main {
            margin-top: var(--header-h);
            height: calc(100vh - var(--header-h));
            display: flex;
        }

        .bc-sidebar {
            width: 260px;
            flex-shrink: 0;
            background: #ffffff;
            border-right: 1px solid #e5e7eb;
            padding: 1.5rem 1rem;
            overflow-y: auto;
        }

        .bc-sidebar-header {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            padding: 0 0.5rem;
        }

        .bc-sidebar-header i {
            font-size: 1.3rem;
            margin-top: 2px;
            color: #7366ff;
        }

        .bc-nav {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .bc-nav-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: transparent;
            border: none;
            border-radius: 10px;
            padding: 0.7rem 0.85rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: #4b5563;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            width: 100%;
        }

        .bc-nav-item i {
            width: 18px;
            text-align: center;
            color: #9ca3af;
        }

        .bc-nav-item:hover {
            background: #f3f4f6;
            color: #1f2937;
        }

        .bc-nav-item.active {
            background: #f1efff;
            color: #7366ff;
        }

        .bc-nav-item.active i {
            color: #7366ff;
        }

        .bc-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 2rem 2.5rem 4rem;
            background: #f9fafb;
        }

        .bc-pane-header {
            margin-bottom: 1.5rem;
        }

        .bc-pane-header h5 {
            font-weight: 700;
            margin-bottom: 0.15rem;
        }

        .bc-pane-header p {
            font-size: 0.85rem;
            color: #6b7280;
            margin: 0;
        }

        .approval-row {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid rgba(229, 231, 235, 0.8);
            padding: 1.1rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
        }

        .approval-row:hover {
            border-color: #c7c0ff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            color: inherit;
        }

        .approval-thumb {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            object-fit: cover;
            background: #f3f4f6;
            flex-shrink: 0;
        }

        .approval-thumb-placeholder {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            background: #f1efff;
            color: #7366ff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.2rem;
        }
    </style>
</head>

<body>
    <header class="app-header">
        <div class="header-brand">
            <div class="brand-logo">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M12 2.5a9.5 9.5 0 1 0 9.5 9.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                <path d="M12 6.5a5.5 5.5 0 1 0 5.5 5.5" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
                <circle cx="12" cy="12" r="1.7" fill="#fff"/>
            </svg>
        </div>
            <div class="brand-text">
                <span class="brand-name">VortexSocial AI</span>
                <span class="brand-tagline">Content Approvals</span>
            </div>
        </div>
        <nav class="header-nav">
            <a href="/dashboard" class="header-nav-item"><i class="fas fa-comments me-2"></i>Studio Chat</a>
            <a href="/approve" class="header-nav-item active"><i class="fas fa-clipboard-check me-1"></i>Approval Requests</a>
        </nav>
        <div class="header-actions">
            <a href="/dashboard" class="btn-secondary-ent text-decoration-none me-2">
                <i class="fas fa-arrow-left me-1"></i>Back to Studio Chat
            </a>
        </div>
    </header>

    <div class="bc-main">
        <aside class="bc-sidebar">
            <div class="bc-sidebar-header">
                <i class="fas fa-user-check"></i>
                <div>
                    <div style="font-weight:700; font-size:0.95rem;">Content Approvals</div>
                    <div style="font-size:0.75rem; color:#6b7280;">Every review request, by status</div>
                </div>
            </div>
            <nav class="bc-nav" id="approvalStatusTabs">
                <button type="button" class="bc-nav-item status-filter-tab active" data-status="">
                    <i class="fas fa-list"></i> All
                </button>
                <button type="button" class="bc-nav-item status-filter-tab" data-status="pending">
                    <i class="fas fa-hourglass-half"></i> Pending
                </button>
                <button type="button" class="bc-nav-item status-filter-tab" data-status="approved">
                    <i class="fas fa-check-circle"></i> Accepted
                </button>
                <button type="button" class="bc-nav-item status-filter-tab" data-status="rejected">
                    <i class="fas fa-times-circle"></i> Rejected
                </button>
            </nav>
        </aside>

        <main class="bc-content">
            <div class="bc-pane-header">
                <h5><i class="fas fa-user-check text-primary me-2"></i>Content Approvals</h5>
                <p>Every review request sent so far, with its current status.</p>
            </div>

            <div class="d-flex flex-column gap-2" id="approvalListBody">
                <div class="text-center text-muted py-5"><i class="fas fa-spinner fa-spin me-2"></i>Loading approval requests...</div>
            </div>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="{{ url_for('static', filename='js/approval_list.js') }}"></script>
</body>

</html>
