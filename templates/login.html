<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — ContentAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="auth-body-light">
<div class="auth-bg-overlay"></div>
<div class="auth-shell">

    <!-- Floating Concept Badges -->
    <div class="auth-floating-badge badge-top-left">
        <i class="fab fa-facebook color-fb me-2"></i>Multi-Channel Publishing
    </div>
    <div class="auth-floating-badge badge-top-right">
        <i class="fas fa-brain text-purple me-2"></i>RAG Memory Engine
    </div>

    <div class="auth-card-light">
        <!-- Brand Header -->
        <div class="auth-brand">
            <div class="brand-logo"><i class="fas fa-robot"></i></div>
            <div>
                <h1 class="auth-title">ContentAI</h1>
                <p class="auth-subtitle">Enterprise Autonomous Social Media Studio</p>
            </div>
        </div>

        <!-- Auth Mode Tabs -->
        <div class="auth-tabs">
            <button type="button" class="auth-tab active" data-mode="login"><i class="fas fa-right-to-bracket me-1"></i>Sign In</button>
            <button type="button" class="auth-tab" data-mode="register"><i class="fas fa-user-plus me-1"></i>Create Account</button>
        </div>

        <!-- Form -->
        <form id="authForm" class="auth-form">
            <div id="nameField" class="d-none">
                <label class="auth-label" for="authName">Full Name</label>
                <div class="auth-input-group">
                    <i class="fas fa-user auth-input-icon"></i>
                    <input id="authName" type="text" class="auth-input" placeholder="e.g. Alex Morgan">
                </div>
            </div>
            
            <div>
                <label class="auth-label" for="authEmail">Work Email</label>
                <div class="auth-input-group">
                    <i class="fas fa-envelope auth-input-icon"></i>
                    <input id="authEmail" type="email" class="auth-input" placeholder="name@company.com" required>
                </div>
            </div>

            <div>
                <label class="auth-label" for="authPassword">Password</label>
                <div class="auth-input-group">
                    <i class="fas fa-lock auth-input-icon"></i>
                    <input id="authPassword" type="password" class="auth-input" placeholder="••••••••" required>
                </div>
            </div>

            <div id="authError" class="auth-error d-none"></div>

            <button id="authSubmit" type="submit" class="btn-auth-submit">
                <i class="fas fa-arrow-right-to-bracket me-2"></i>Sign In to Workspace
            </button>
        </form>


    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
