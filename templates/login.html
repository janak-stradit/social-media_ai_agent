<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — AVIR AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

<div class="auth-split-layout">
    <div class="auth-left-pane">
        <div class="auth-brand-logo">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M12 2.5a9.5 9.5 0 1 0 9.5 9.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                    <path d="M12 6.5a5.5 5.5 0 1 0 5.5 5.5" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
                    <circle cx="12" cy="12" r="1.7" fill="#fff"/>
                </svg>
            </div>
            <div>
                <span class="brand-name">AVIR AI <span class="beta-badge">Beta</span></span>
                <span class="brand-tagline">Autonomous Social Studio</span>
            </div>
        </div>

        <div class="auth-card">
            <div class="auth-card-header">
                <div class="card-icon-circle"><i class="fas fa-right-to-bracket"></i></div>
                <div>
                    <h1 class="auth-heading">Sign in</h1>
                    <p class="auth-subheading">Welcome back to AVIR AI</p>
                </div>
            </div>

        <form id="authForm">
            <div class="auth-form-group">
                <label class="auth-form-label" for="authEmail">Email</label>
                <input id="authEmail" type="email" class="auth-form-input" placeholder="name@email.com" autocomplete="email" required>
            </div>

            <div class="auth-form-group">
                <label class="auth-form-label" for="authPassword">Password</label>
                <div class="auth-password-wrap">
                    <input id="authPassword" type="password" class="auth-form-input" placeholder="••••••••" autocomplete="current-password" required>
                    <button type="button" class="auth-password-toggle" id="togglePasswordBtn" aria-label="Show password" aria-pressed="false">
                        <i class="fas fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <div id="authError" class="alert-inline alert-inline-danger" style="margin-bottom: 12px; display: none;" role="alert"></div>

            <button id="authSubmit" type="submit" class="btn-primary-blue">
                <span id="authSubmitText">Log in</span>
            </button>
        </form>

        <div class="auth-footer-links">
            <a href="/forgot-password" class="auth-link-bold" style="font-size: 13px;">Forgot my password?</a>

            <div class="auth-footer-row">
                <span style="color: #6B7280; font-size: 12px;">Don't have an account? <a href="/signup" class="auth-link-bold">Sign up</a></span>
            </div>

            <a class="auth-made-by" href="https://stradit.com/" target="_blank" rel="noopener" title="AVIR AI is a product of StradIT">A product of <span class="stradit-badge"><span class="stradit-mark"><img src="/static/img/brand/stradit-logo.png" alt="StradIT" width="640" height="160"></span></span></a>
        </div>
        </div>
    </div>

    {% set panel = 'login' %}{% include 'partials/auth_panel.html' %}
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>

    // Password show/hide toggle
    $('#togglePasswordBtn').on('click', function () {
        const $input = $('#authPassword');
        const showing = $input.attr('type') === 'text';
        $input.attr('type', showing ? 'password' : 'text');
        $(this).attr('aria-pressed', String(!showing)).attr('aria-label', showing ? 'Show password' : 'Hide password');
        $(this).find('i').toggleClass('fa-eye fa-eye-slash');
    });

    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    $('#authForm').on('submit', function (e) {
        e.preventDefault();
        $('#authError').hide();

        const email = $('#authEmail').val().trim();
        const password = $('#authPassword').val();

        if (!email || !EMAIL_RE.test(email)) {
            $('#authError').text('Enter a valid email address.').show();
            return;
        }
        if (!password) {
            $('#authError').text('Password is required.').show();
            return;
        }

        const $submitBtn = $('#authSubmit');
        const originalLabel = $('#authSubmitText').text();
        $submitBtn.prop('disabled', true);
        $('#authSubmitText').html('<i class="fas fa-spinner fa-spin"></i> Signing in...');

        $.ajax({
            url: '/api/auth/login',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ email: email, password: password }),
            success: function (res) {
                if (res.success) {
                    window.location.href = '/dashboard';
                } else {
                    $submitBtn.prop('disabled', false);
                    $('#authSubmitText').text(originalLabel);
                    $('#authError').text(res.error || 'Something went wrong.').show();
                }
            },
            error: function (xhr) {
                const msg = xhr.responseJSON ? xhr.responseJSON.error : 'An error occurred';
                $('#authError').text(msg).show();
                $submitBtn.prop('disabled', false);
                $('#authSubmitText').text(originalLabel);
            }
        });
    });

</script>
</body>
</html>
