<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — VortexSocial AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

<div class="auth-split-layout">
    <div class="auth-left-pane">
        <div class="auth-brand-logo">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M12 2.5a9.5 9.5 0 1 0 9.5 9.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                    <path d="M12 6.5a5.5 5.5 0 1 0 5.5 5.5" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
                    <circle cx="12" cy="12" r="1.7" fill="#fff"/>
                </svg>
            </div>
            <div>
                <span class="brand-name">VortexSocial AI</span>
                <span class="brand-tagline">Autonomous Social Studio</span>
            </div>
        </div>

        <div class="auth-card">
            <!-- Request form -->
            <div id="forgotFormView">
                <div class="auth-card-header">
                    <div class="card-icon-circle"><i class="fas fa-key"></i></div>
                    <div>
                        <h1 class="auth-heading">Forgot password?</h1>
                        <p class="auth-subheading">Enter your email and we'll send you a link to reset it.</p>
                    </div>
                </div>

                <form id="forgotForm" novalidate>
                    <div class="auth-form-group">
                        <label class="auth-form-label" for="forgotEmail">Email</label>
                        <input id="forgotEmail" type="email" class="auth-form-input" placeholder="name@email.com" autocomplete="email" required>
                    </div>

                    <div id="forgotError" class="alert-inline alert-inline-danger" style="margin-bottom: 12px; display: none;" role="alert"></div>

                    <button id="forgotSubmit" type="submit" class="btn-primary-blue">
                        <span id="forgotSubmitText">Send reset link</span>
                    </button>
                </form>
            </div>

            <!-- Sent confirmation -->
            <div id="forgotSentView" class="auth-state" style="display: none;" role="status">
                <div class="card-icon-circle auth-state-icon auth-state-success"><i class="fas fa-envelope-circle-check"></i></div>
                <h1 class="auth-heading">Check your inbox</h1>
                <p class="auth-subheading">If an account exists for <strong id="forgotSentEmail"></strong>, we've sent a link to reset your password. It expires in 1 hour.</p>
                <button type="button" class="auth-link-bold auth-state-retry" id="forgotRetryBtn">Didn't get it? Try again</button>
            </div>

            <div class="auth-footer-links">
                <div class="auth-footer-row">
                    <a href="/login" class="auth-link-bold"><i class="fas fa-arrow-left" style="margin-right: 6px;"></i>Back to log in</a>
                </div>
            </div>
        </div>
    </div>

    <div class="auth-right-pane" aria-hidden="true">
        <div class="auth-scene-bg" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden;">
            <div class="auth-scene-caption">
                Locked out?<br>
                <strong>back in within a minute</strong>
            </div>
            <div class="auth-reset-mock">
                <div class="auth-reset-mock-head">
                    <div class="card-icon-circle"><i class="fas fa-lock-open"></i></div>
                    <div>
                        <div class="auth-reset-mock-bar" style="width: 120px;"></div>
                        <div class="auth-reset-mock-bar" style="width: 70px; margin-bottom: 0;"></div>
                    </div>
                </div>
                <div class="auth-reset-mock-field"></div>
                <div class="auth-reset-mock-field"></div>
                <div class="auth-reset-mock-btn"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function showForm() {
        $('#forgotSentView').hide();
        $('#forgotFormView').show();
        $('#forgotEmail').trigger('focus');
    }

    $('#forgotRetryBtn').on('click', showForm);

    $('#forgotForm').on('submit', function (e) {
        e.preventDefault();
        const $err = $('#forgotError').hide();
        const email = $('#forgotEmail').val().trim();
        if (!EMAIL_RE.test(email)) {
            $err.text('Enter a valid email address.').show();
            return;
        }

        const $btn = $('#forgotSubmit').prop('disabled', true);
        $('#forgotSubmitText').html('<i class="fas fa-spinner fa-spin"></i> Sending...');

        $.ajax({
            url: '/api/auth/forgot-password',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ email: email }),
            success: function () {
                $('#forgotSentEmail').text(email);
                $('#forgotFormView').hide();
                $('#forgotSentView').show();
            },
            error: function (xhr) {
                $err.text((xhr.responseJSON && xhr.responseJSON.error) || 'Something went wrong. Please try again.').show();
            },
            complete: function () {
                $btn.prop('disabled', false);
                $('#forgotSubmitText').text('Send reset link');
            }
        });
    });
</script>
</body>
</html>
