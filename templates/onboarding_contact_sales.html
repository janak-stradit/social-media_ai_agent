<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Sales — VortexSocial AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #F8FAFC; font-family: 'Rubik', system-ui, sans-serif; margin: 0; padding: 24px;
            position: relative; overflow: hidden;
        }
        .bg-mesh {
            position: absolute; top: -20%; left: -10%; width: 120%; height: 120%; z-index: 0;
            background-image: radial-gradient(at 40% 20%, hsla(255,100%,85%,1) 0px, transparent 50%),
                               radial-gradient(at 80% 0%, hsla(189,100%,88%,1) 0px, transparent 50%),
                               radial-gradient(at 0% 50%, hsla(340,100%,93%,1) 0px, transparent 50%);
            filter: blur(80px); opacity: 0.6; animation: blob-bounce 22s infinite alternate;
        }
        @keyframes blob-bounce {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.08); }
            66% { transform: translate(-20px, 20px) scale(0.94); }
            100% { transform: translate(0, 0) scale(1); }
        }
        @media (prefers-reduced-motion: reduce) { .bg-mesh { animation: none; } }

        .onboard-steps { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px; }
        .onboard-step-dot { width: 8px; height: 8px; border-radius: 50%; background: #E5E7EB; transition: all 0.2s ease; }
        .onboard-step-dot.active { background: #7366FF; width: 22px; border-radius: 4px; }
        .onboard-step-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #9CA3AF; margin-bottom: 8px; text-align: center; }

        .sales-back-link {
            display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;
            color: #6B7280; text-decoration: none; margin-bottom: 20px; transition: color 0.15s ease;
        }
        .sales-back-link:hover { color: #111827; }

        .sales-card {
            position: relative; z-index: 1;
            max-width: 460px; width: 100%; background: #fff; border-radius: 20px; padding: 48px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }
        .sales-heading { font-size: 24px; font-weight: 700; color: #111827; letter-spacing: -0.02em; margin-bottom: 8px; text-align: center; }
        .sales-subheading { font-size: 14px; color: #6B7280; text-align: center; margin-bottom: 28px; line-height: 1.6; }
        #salesError { margin-top: 4px; margin-bottom: 12px; display: none; }
        .d-none { display: none !important; }

        .confirm-icon {
            width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 20px;
            background: linear-gradient(135deg, #54BA4A, #3f9536); display: flex; align-items: center; justify-content: center;
        }
        .confirm-icon i { color: #fff; font-size: 26px; }
    </style>
</head>
<body>
    <div class="bg-mesh" aria-hidden="true"></div>
    <div class="sales-card">
        <div class="onboard-step-label">Step 2 of 2</div>
        <div class="onboard-steps" aria-hidden="true">
            <span class="onboard-step-dot active"></span>
            <span class="onboard-step-dot active"></span>
        </div>
        <div class="auth-brand-logo" style="justify-content: center; margin-bottom: 28px;">
            <span class="auth-brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2.5a9.5 9.5 0 1 0 9.5 9.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                    <path d="M12 6.5a5.5 5.5 0 1 0 5.5 5.5" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
                    <circle cx="12" cy="12" r="1.7" fill="#fff"/>
                </svg>
            </span>
            VortexSocial AI
        </div>

        <div id="salesFormView">
            <a href="/onboarding" class="sales-back-link"><i class="fas fa-arrow-left" aria-hidden="true"></i>Back to account type</a>
            <h1 class="sales-heading">Let's talk</h1>
            <p class="sales-subheading">Enterprise plans are set up with our sales team. Tell us a bit about your organization and we'll be in touch.</p>

            <form id="salesForm">
                <div class="auth-form-group">
                    <label class="auth-form-label" for="companyName">Company name</label>
                    <input id="companyName" type="text" class="auth-form-input" placeholder="Acme Corp" autocomplete="organization" required>
                </div>
                <div class="auth-form-group">
                    <label class="auth-form-label" for="companyPhone">Phone <span style="font-weight: 400; color: #9CA3AF;">(optional)</span></label>
                    <input id="companyPhone" type="tel" class="auth-form-input" placeholder="+1 (555) 000-0000" autocomplete="tel">
                </div>
                <div class="auth-form-group">
                    <label class="auth-form-label" for="companyMessage">What are you looking for? <span style="font-weight: 400; color: #9CA3AF;">(optional)</span></label>
                    <textarea id="companyMessage" class="auth-form-input" style="height: 90px; padding-top: 10px; resize: vertical;" placeholder="Team size, use case, timeline..."></textarea>
                </div>

                <div id="salesError" class="alert-inline alert-inline-danger" role="alert"></div>

                <button id="salesSubmitBtn" type="submit" class="btn-primary-blue">
                    <span id="salesSubmitBtnText">Request a call</span>
                </button>
            </form>
        </div>

        <div id="salesConfirmView" class="d-none" style="text-align: center;">
            <div class="confirm-icon" aria-hidden="true"><i class="fas fa-check"></i></div>
            <h1 class="sales-heading">Thanks - we'll be in touch</h1>
            <p class="sales-subheading">Our sales team will reach out shortly to help set up your Enterprise workspace.</p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $('#salesForm').on('submit', function (e) {
            e.preventDefault();
            const $err = $('#salesError').hide();
            const companyName = $('#companyName').val().trim();
            if (!companyName) {
                $err.text('Company name is required.').show();
                return;
            }

            const $btn = $('#salesSubmitBtn');
            $btn.prop('disabled', true);
            $('#salesSubmitBtnText').html('<i class="fas fa-spinner fa-spin"></i> Sending...');

            $.ajax({
                url: '/api/onboarding/contact-sales',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    company_name: companyName,
                    phone: $('#companyPhone').val().trim(),
                    message: $('#companyMessage').val().trim()
                }),
                success: function (res) {
                    if (res.success) {
                        $('#salesFormView').addClass('d-none');
                        $('#salesConfirmView').removeClass('d-none');
                    } else {
                        $err.text(res.error || 'Something went wrong.').show();
                        $btn.prop('disabled', false);
                        $('#salesSubmitBtnText').text('Request a call');
                    }
                },
                error: function (xhr) {
                    $err.text((xhr.responseJSON && xhr.responseJSON.error) || 'Something went wrong.').show();
                    $btn.prop('disabled', false);
                    $('#salesSubmitBtnText').text('Request a call');
                }
            });
        });
    </script>
</body>
</html>
